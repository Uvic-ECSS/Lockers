{{define "lockertable"}}
<script>
  document.addEventListener("htmx:afterRequest", function (event) {
    if (event.detail.xhr.status === 204) {
      const tr = event.target.closest("tr");
      if (tr) tr.remove();
    }
    if (event.detail.elt.matches("[data-history-button]") && event.detail.xhr.status === 200) {
      document.getElementById("history-modal").showModal();
    }
  });
</script>

<div class="overflow-x-auto rounded-box border border-base-300 max-h-[65vh] overflow-y-auto">
  <table class="table table-zebra table-pin-rows">
    <thead>
      <tr>
        <th>Locker</th>
        <th>Name</th>
        <th>Email</th>
        <th>Expires on</th>
        <th><span class="sr-only">Remove</span></th>
        <th><span class="sr-only">History</span></th>
      </tr>
    </thead>

    <tbody>
      {{range $reg := .Registrations}}
      <tr>
        <td class="font-medium">{{$reg.Locker}}</td>
        <td>{{$reg.Name}}</td>
        <td class="opacity-80">{{$reg.Email}}</td>
        <td class="whitespace-nowrap">{{$reg.Expiry}}</td>
        <td>
          <button
            class="btn btn-outline btn-error btn-xs"
            type="button"
            hx-delete="/admin/registration?locker={{$reg.Locker | urlquery}}"
            hx-confirm="Remove {{$reg.Name}}'s registration for {{$reg.Locker}}?"
          >
            remove
          </button>
        </td>
        <td>
          <button
            class="btn btn-outline btn-primary btn-xs"
            type="button"
            data-history-button
            hx-get="/admin/history?locker={{$reg.Locker | urlquery}}"
            hx-target="#history-modal-content"
            hx-swap="innerHTML"
          >
            history
          </button>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>

<dialog id="history-modal" class="modal" aria-labelledby="history-modal-title">
  <div id="history-modal-content" class="modal-box">
    <h2 id="history-modal-title" class="text-lg font-semibold">Locker history</h2>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close">close</button></form>
</dialog>
{{end}}
